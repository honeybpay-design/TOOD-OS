services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: tood_dev_admin
      POSTGRES_DB: tood
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tood"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
