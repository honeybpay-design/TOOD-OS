name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/gemini-launch-audit]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Redacted full-history secret scan
        run: python scripts/test_suites/scan_secrets.py --output audit/ci-secret-scan.json

  api:
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install reviewed test tools
        run: python -m pip install pytest==8.4.2 ruff==0.17.0 PyYAML==6.0.3
      - name: API and runner lint
        run: ruff check apps/api scripts/test_suites scripts/verify_install.py scripts/setup_gcp_secrets.py --config apps/api/pyproject.toml
      - name: Repository identity regression tests
        run: python -m unittest discover -s scripts/test_suites -p test_runner_identity.py -v
      - name: Workflow safety policy tests
        run: python -m unittest discover -s scripts/test_suites -p test_ci_policy.py -v
      - name: Provisioning tests with fake clients only
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q security-tests/test_secret_provisioning.py --confcutdir=security-tests
      - name: Build once and run all configured API tests plus 17 installation checks
        run: python scripts/test_suites/ci_api.py
      - name: Retain bounded test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-quality-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            audit/implementations/ci/**/CI-LOCAL-SUMMARY.json
            audit/implementations/ci/**/SOURCE-PROOF.json
            audit/implementations/ci/**/results/execution-state.json
            audit/implementations/ci/**/results/full-pytest-result.json
            audit/implementations/ci/**/results/pytest.xml
            audit/implementations/ci/**/results/install.stdout.log

  web:
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_URL: http://127.0.0.1:9
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npx tsc --noEmit --incremental false
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  quality:
    if: always()
    needs: [secrets, api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require success from every quality and security job
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["REQUIRED_RESULTS"])
          if set(results) != {"secrets", "api", "web"}:
              raise SystemExit("Required job set is incomplete or unexpected")
          if any(item.get("result") != "success" for item in results.values()):
              raise SystemExit("Required gate did not succeed")
          print("All required CI quality gates succeeded. No deployment is performed by this workflow.")
          PY
