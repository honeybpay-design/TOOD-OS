apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tood-os-web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containers:
      - image: europe-west2-docker.pkg.dev/tood-os/tood/web:latest
        ports:
        - containerPort: 3000
        env:
        - name: API_URL
          value: https://api.tood.uk
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
