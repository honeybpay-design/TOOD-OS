apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tood-os-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: tood-os:europe-west2:tood-db
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containers:
      - image: europe-west2-docker.pkg.dev/tood-os/tood/api:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-url
              key: latest
        - name: AUTH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-database-url
              key: latest
        - name: DATABASE_ADMIN_URL
          valueFrom:
            secretKeyRef:
              name: database-admin-url
              key: latest
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secret-key
              key: latest
        - name: STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-publishable-key
              key: latest
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: stripe-webhook-secret
              key: latest
        - name: STRIPE_PRICE_STARTER
          valueFrom:
            secretKeyRef:
              name: stripe-price-starter
              key: latest
        - name: STRIPE_PRICE_PROFESSIONAL
          valueFrom:
            secretKeyRef:
              name: stripe-price-professional
              key: latest
        - name: STRIPE_PRICE_ENTERPRISE
          valueFrom:
            secretKeyRef:
              name: stripe-price-enterprise
              key: latest
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google-client-id
              key: latest
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: google-client-secret
              key: latest
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: session-secret
              key: latest
        - name: AI_PROVIDER
          valueFrom:
            secretKeyRef:
              name: ai-provider
              key: latest
        - name: GCP_PROJECT
          value: "tood-os"
        - name: GCP_REGION
          value: "europe-west2"
        - name: ALLOW_SIGNUP
          value: "false"
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
