apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tood-os-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: tood-os:europe-west2:tood-db
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containers:
      - image: europe-west2-docker.pkg.dev/tood-os/tood/api:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tood-secrets
              key: DATABASE_URL
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tood-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: tood-secrets
              key: STRIPE_WEBHOOK_SECRET
        - name: DATABASE_ADMIN_URL
          valueFrom:
            secretKeyRef:
              name: tood-secrets
              key: DATABASE_ADMIN_URL
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
