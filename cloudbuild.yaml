steps:
  # ── Build API image ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-api
    args:
      - build
      - -t
      - europe-west2-docker.pkg.dev/tood-os/tood/api:$COMMIT_SHA
      - -t
      - europe-west2-docker.pkg.dev/tood-os/tood/api:latest
      - apps/api

  - name: 'gcr.io/cloud-builders/docker'
    id: push-api
    waitFor: [build-api]
    args:
      - push
      - --all-tags
      - europe-west2-docker.pkg.dev/tood-os/tood/api

  # ── Build Web image ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-web
    args:
      - build
      - -t
      - europe-west2-docker.pkg.dev/tood-os/tood/web:$COMMIT_SHA
      - -t
      - europe-west2-docker.pkg.dev/tood-os/tood/web:latest
      - apps/web

  - name: 'gcr.io/cloud-builders/docker'
    id: push-web
    waitFor: [build-web]
    args:
      - push
      - --all-tags
      - europe-west2-docker.pkg.dev/tood-os/tood/web

  # ── Deploy API ───────────────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-api
    waitFor: [push-api]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - tood-os-api
      - --image=europe-west2-docker.pkg.dev/tood-os/tood/api:$COMMIT_SHA
      - --region=europe-west2
      - --project=tood-os

  # ── Deploy Web ───────────────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-web
    waitFor: [push-web]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - tood-os-web
      - --image=europe-west2-docker.pkg.dev/tood-os/tood/web:$COMMIT_SHA
      - --region=europe-west2
      - --project=tood-os
      - --set-env-vars=API_URL=https://tood-os-api-iiwda4phia-nw.a.run.app

images:
  - europe-west2-docker.pkg.dev/tood-os/tood/api:$COMMIT_SHA
  - europe-west2-docker.pkg.dev/tood-os/tood/api:latest
  - europe-west2-docker.pkg.dev/tood-os/tood/web:$COMMIT_SHA
  - europe-west2-docker.pkg.dev/tood-os/tood/web:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
